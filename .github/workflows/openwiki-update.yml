name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

# Only one run may prepare/update the shared PR branch at a time.
concurrency:
  group: openwiki-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# Inference runs on Ollama Cloud through OpenWiki's OpenAI-compatible provider.
#   Secret   OLLAMA_API_KEY      ollama.com -> Settings -> Keys (the job skips cleanly until it's set)
#   Variable OPENWIKI_MODEL_ID   optional; any Ollama Cloud model id (default below)
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_OLLAMA_KEY: ${{ secrets.OLLAMA_API_KEY != '' }}
    steps:
      - name: Skip without an Ollama API key
        if: ${{ env.HAS_OLLAMA_KEY != 'true' }}
        run: echo "::notice title=OpenWiki skipped::Add the OLLAMA_API_KEY repository secret to enable wiki updates."

      - name: Check out repository
        if: ${{ env.HAS_OLLAMA_KEY == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ env.HAS_OLLAMA_KEY == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install OpenWiki
        if: ${{ env.HAS_OLLAMA_KEY == 'true' }}
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.7.2 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        if: ${{ env.HAS_OLLAMA_KEY == 'true' }}
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: https://ollama.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID || 'kimi-k2.7-code' }}

      - name: Prepare OpenWiki documentation changes
        id: prepare
        if: ${{ !cancelled() && env.HAS_OLLAMA_KEY == 'true' && (steps.openwiki.outcome == 'success' || steps.openwiki.outcome == 'failure') }}
        env:
          OPENWIKI_OUTCOME: ${{ steps.openwiki.outcome }}
        run: bash .github/scripts/prepare-openwiki-update.sh "$OPENWIKI_OUTCOME"

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() && steps.prepare.outputs.has-changes == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: ${{ steps.prepare.outputs.list }}
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This PR contains OpenWiki output, which can include pages, Claims,
            manifests, or metadata from a successful check with no content changes.
            Review the diff and recorded status before merging. An `interrupted`
            status preserves unfinished-work semantics and must not be treated as
            a completed update. Failed status-only attempts are not published.

      - name: Annotate OpenWiki update pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        run: echo "::notice title=OpenWiki update pull request::${{ steps.create-pr.outputs.pull-request-url }}"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
